<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>SSE fetch + ReadableStream test</title>
</head>
<body>
  <button id="start">연결 시작</button>
  <pre id="log"></pre>

  <script>
    const logEl = document.getElementById('log');

    function log(line) {
      logEl.textContent += line + '\n';
    }

    // "event:MESSAGE\ndata:event 1" 같은 한 이벤트 블록 텍스트를
    // { name: "MESSAGE", data: "event 1" } 객체로 변환 (WHATWG SSE spec 준수)
    function parseEventBlock(block) {
      let name = null;               // event: 없으면 나중에 "message"로 기본값 처리
      const dataLines = [];          // data: 줄이 여러 개면 \n으로 합칠 것이므로 배열에 모음

      for (const line of block.split('\n')) {
        if (line.startsWith(':')) {
          continue; // 주석/keep-alive 줄 — 필드가 아니라 통째로 무시
        }
        if (line.startsWith('event:')) {
          name = line.slice('event:'.length).trimStart();
        } else if (line.startsWith('data:')) {
          dataLines.push(line.slice('data:'.length).trimStart());
        }
        // id:, retry: 등 다른 필드는 이번 실습 범위 밖이라 무시
      }

      return {
        name: name ?? 'message',   // event: 필드가 없으면 스펙 기본값 "message"
        data: dataLines.join('\n') // data: 줄 여러 개 → \n으로 이어붙임
      };
    }

    async function connect() {
      const response = await fetch('/sse/hello');
      const reader = response.body.getReader();
      const decoder = new TextDecoder();

      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        // buffer 안에 완성된 이벤트(빈 줄로 끝나는 블록)가 있는 동안 계속 꺼낸다
        let boundary;
        while ((boundary = buffer.indexOf('\n\n')) !== -1) {
          const block = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2); // 블록 + "\n\n" 만큼 잘라내고 나머지는 버퍼에 유지

          const { name, data } = parseEventBlock(block);
          log(`[${name}] ${data}`);
        }
      }

      log('--- stream closed ---');
    }

    document.getElementById('start').addEventListener('click', connect);
  </script>
</body>
</html>
